apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wallpaper-app

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

# Argo CD Image Updater rewrites `newTag` here on each new build and commits it back
# to this repo. Do not hand-edit while the updater is enabled.
images:
  - name: ghcr.io/vijai-veerapandian/wallpaper-app
    newTag: latest
