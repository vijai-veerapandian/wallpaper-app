apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wallpaper-app

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

# This tag IS the deployment. Argo CD watches this file, not the registry — pushing
# a new image changes nothing until `newTag` here changes and is committed.
#
# To deploy:
#   cd deploy && kustomize edit set image \
#     ghcr.io/vijai-veerapandian/wallpaper-app=ghcr.io/vijai-veerapandian/wallpaper-app:sha-abc1234
#   git commit -am "deploy: sha-abc1234" && git push
#
# Always an immutable sha- tag, never `latest`: `latest` moves, so git would no
# longer record what is actually running and rollback would be meaningless.
images:
  - name: ghcr.io/vijai-veerapandian/wallpaper-app
    newTag: latest # replaced with sha-<short> on first real deploy
