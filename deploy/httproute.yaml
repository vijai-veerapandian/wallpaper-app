apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wallpaper-app
  labels:
    app.kubernetes.io/name: wallpaper-app
spec:
  # The shared Gateway from Phase 3. Its wildcard listener already covers
  # *.k8s.vijaiveerapandian.com, so no new certificate is issued.
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
  hostnames:
    - "wallpaper.k8s.vijaiveerapandian.com"
  rules:
    - backendRefs:
        - name: wallpaper-app
          port: 80
