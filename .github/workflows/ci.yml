name: CI

# Three stages:
#   1. quality  — lint, format, unit tests
#   2. security — secrets, SAST, dependency CVEs
#   3. build    — build image, scan it, run DAST, then publish and sign
#
# Nothing is published until every scan has passed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly. An image clean on build day picks up CVEs as new advisories land.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 app tests

      - name: Format check
        run: black --check app tests

      - name: Unit tests
        run: pytest -v --cov=app --cov-report=term-missing

  # ---------------------------------------------------------------- 2
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history — a secret that was committed and later
          # removed is still in the git objects, and still needs rotating.
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CodeQL is dataflow analysis; results go to the Security tab automatically.
      - name: SAST init
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: SAST analyze
        uses: github/codeql-action/analyze@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      # bandit catches Python-specific patterns CodeQL does not. -ll = medium+.
      - name: Python security lint
        run: bandit -r app -ll

      # Gates on runtime dependencies only. Dev tooling CVEs are tracked by
      # Dependabot but do not block a release — they never ship in the image.
      - name: Dependency CVEs
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------- 3
  build:
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Scan Kubernetes manifests
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: deploy/

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Built locally first so it is scanned before anyone can pull it.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:test
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy.sarif

      - name: Publish image scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      # DAST: run the container and attack it. Catches what static analysis
      # cannot — missing security headers, exposed endpoints, injection.
      - name: DAST (OWASP ZAP)
        run: |
          docker run -d --name app -p 5000:5000 app:test
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/health && break || sleep 2
          done
          docker run --rm --network host -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:5000 -r zap-report.html
          docker rm -f app

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
          if-no-files-found: ignore

      # ---- publish (main only) ----
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # Keyless: identity comes from the Actions OIDC token, signature goes to
      # the registry and the Rekor transparency log. No private key to manage.
      - name: Sign image
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
