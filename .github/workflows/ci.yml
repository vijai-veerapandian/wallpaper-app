name: CI

on:
  push:
    branches:
      - main
    # No paths-ignore, deliberately. `main` has branch protection with required
    # status checks, and a workflow that never triggers reports nothing — so the
    # check stays permanently pending and the merge is blocked. That would make a
    # deploy commit (a one-line newTag bump) or a README edit unmergeable.
    #
    # To skip expensive jobs for manifest-only changes later, filter at the JOB
    # level (dorny/paths-filter + `if:`). A skipped job reports as skipped and
    # satisfies branch protection; a workflow that never runs does not.
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-scan. An image clean on build day accumulates CVEs as new
    # advisories are published against unchanged dependencies. Also runs the
    # deeper ZAP full scan.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Read-only by default; each job widens only what it needs.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- lint
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: flake8
        run: flake8 app tests

      - name: black --check
        run: black --check app tests

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload hadolint SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  # -------------------------------------------------------- secret scan
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. A secret committed and later removed still exists in
          # the git objects, and still needs rotating.
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------- SAST
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # bandit is pattern-based, CodeQL is dataflow-based. Different findings.
      - name: bandit
        run: bandit -r app -f sarif -o bandit.sarif || true

      - name: Upload bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  # -------------------------------------------------------- dependencies
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pip-audit
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt requirements-dev.txt

      # Blocks a PR that introduces a vulnerable or badly-licensed dependency.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------- test
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pytest with coverage
        # Add --cov-fail-under=<N> once you know today's number. Set it at the
        # current value and ratchet up; guessing a threshold breaks the build.
        run: |
          pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  # ------------------------------------------------------------ IaC scan
  iac-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Missing securityContext, absent resource limits, privileged containers.
      - name: Trivy config scan (deploy/)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: deploy/
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload Trivy config SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  # ------------------------------------------------------ build / scan / push
  #
  # Ordering is the security property here: the image is built locally, scanned
  # statically (Trivy) and dynamically (ZAP), and only then published. Nothing
  # unscanned ever reaches GHCR.
  build:
    needs: [lint, secret-scan, sast, dependencies, test, iac-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
      # Required for cosign keyless signing (Fulcio/Rekor OIDC).
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: scan-target:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------- static (Trivy)
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan-target:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          # Reports without blocking. Flip to "1" to gate releases on CVEs once
          # you have seen a few clean runs and know the baseline.
          exit-code: "0"

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # ------------------------------------------------------- dynamic (ZAP)
      - name: Start application for DAST
        run: |
          docker run -d --name dast-target -p 5000:5000 scan-target:${{ github.sha }}
          # Wait for the app's own /health endpoint rather than a fixed sleep.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health >/dev/null 2>&1; then
              echo "app is up"; exit 0
            fi
            sleep 2
          done
          echo "app failed to become healthy"; docker logs dast-target; exit 1

      # Baseline: passive scan plus spider. Fast, safe, low false positives.
      - name: ZAP baseline scan
        if: github.event_name != 'schedule'
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:5000
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false

      # Full scan: active attacks. Slow and noisy, so weekly only.
      - name: ZAP full scan
        if: github.event_name == 'schedule'
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: http://localhost:5000
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: ignore

      - name: Stop application
        if: always()
        run: docker rm -f dast-target || true

      # ------------------------------------------------------- publish
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      # Keyless: identity comes from the Actions OIDC token; the signature goes
      # to the registry and the Rekor transparency log. No private key to hold.
      # Kyverno verifyImages consumes this in Phase 12.
      - name: Sign image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
