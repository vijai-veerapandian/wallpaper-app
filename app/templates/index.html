{% extends "base.html" %}

{% block content %}
<div class="wallpaper-container">
  <div class="slot-badge">Active slot: {{ active_slot }}</div>
  {# Data passed via attributes, not an inline <script>, so the Content-Security-Policy
     can stay strict. An inline script would force 'unsafe-inline' on script-src. #}
  <div id="wallpaper" class="wallpaper"
       {# Single-quoted: tojson emits double quotes, which would end the attribute early.
          Jinja escapes ' as ', so single quotes are safe here. #}
       data-wallpapers='{{ wallpapers | tojson }}'
       data-rotation-seconds="{{ rotation_seconds }}"></div>
  <button id="fullscreen-btn" class="fullscreen-btn">Fullscreen</button>
</div>
{% endblock %}
